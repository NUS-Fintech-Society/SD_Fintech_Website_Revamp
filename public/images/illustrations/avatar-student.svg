<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" width="260" height="260" role="img" aria-labelledby="st-title">
  <title id="st-title">Student</title>
  <!-- Palette (site tokens only): NUS Blue #003D7C, Navy #0B1E33, NUS Orange #EF7C00, White #FFFFFF,
       Blue tint #E3EAF2, Border #DDE3EA, Track #C3CDD9, Ink #14262B -->

  <!-- Frame: white ring and tinted disc (the same 260px frame as the About avatars) -->
  <circle cx="130" cy="130" r="126" fill="#FFFFFF"/>
  <circle cx="130" cy="130" r="112" fill="#E3EAF2"/>

  <!-- Neck -->
  <path d="M118 146 V172 Q130 180 142 172 V146 Z" fill="#DDE3EA"/>

  <!-- Zip-up hoodie: shoulders, with the lower edge following the disc so no clip path is needed -->
  <path d="M40 196.7 C52 176 86 168 130 168 C174 168 208 176 220 196.7 A112 112 0 0 1 40 196.7 Z" fill="#EF7C00"/>

  <!-- White tee at the neckline, a navy hood collar and the zip -->
  <path d="M114 168 C116 182 144 182 146 168 Z" fill="#FFFFFF"/>
  <path d="M106 168 C108 186 120 190 130 190 C140 190 152 186 154 168" fill="none" stroke="#0B1E33" stroke-width="6" stroke-linecap="round"/>
  <path d="M130 190 V240" stroke="#FFFFFF" stroke-width="3"/>

  <!-- Backpack straps -->
  <g fill="none" stroke="#003D7C" stroke-width="10" stroke-linecap="round">
    <path d="M78 178 C84 196 88 214 90 232"/>
    <path d="M182 178 C176 196 172 214 170 232"/>
  </g>

  <!-- Head -->
  <circle cx="94" cy="114" r="9" fill="#FFFFFF"/>
  <circle cx="166" cy="114" r="9" fill="#FFFFFF"/>
  <ellipse cx="130" cy="112" rx="36" ry="40" fill="#FFFFFF"/>

  <!-- Hair: short curls -->
  <g fill="#0B1E33">
    <path d="M94 108 C90 80 106 66 130 66 C154 66 170 80 166 108 C160 96 148 90 130 90 C112 90 100 96 94 108 Z"/>
    <circle cx="100" cy="88" r="12"/>
    <circle cx="114" cy="74" r="13"/>
    <circle cx="130" cy="69" r="14"/>
    <circle cx="146" cy="74" r="13"/>
    <circle cx="160" cy="88" r="12"/>
    <circle cx="96" cy="101" r="8"/>
    <circle cx="164" cy="101" r="8"/>
  </g>

  <!-- Face -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M107 100 Q115 96 123 99" stroke="#0B1E33" stroke-width="3.5"/>
    <path d="M137 99 Q145 96 153 100" stroke="#0B1E33" stroke-width="3.5"/>
    <path d="M130 118 Q126 126 131 129" stroke="#C3CDD9" stroke-width="3"/>
    <path d="M119 134 Q130 145 141 134" stroke="#14262B" stroke-width="3.5"/>
  </g>
  <circle cx="115" cy="112" r="3.8" fill="#14262B"/>
  <circle cx="145" cy="112" r="3.8" fill="#14262B"/>

  <!-- Badge: speech bubble -->
  <g>
    <circle cx="204" cy="58" r="24" fill="#003D7C" stroke="#FFFFFF" stroke-width="5"/>
    <rect x="190" y="46" width="28" height="19" rx="7" fill="#FFFFFF"/>
    <path d="M197 63 L194 72 L204 64 Z" fill="#FFFFFF"/>
    <circle cx="198" cy="55.5" r="2.5" fill="#003D7C"/>
    <circle cx="204" cy="55.5" r="2.5" fill="#EF7C00"/>
    <circle cx="210" cy="55.5" r="2.5" fill="#003D7C"/>
  </g>
</svg>
